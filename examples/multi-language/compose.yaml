services:
  python-demo:
    build:
      context: ../..
      dockerfile: examples/multi-language/python/Dockerfile
    environment:
      MEERKATEER_URL: ${MEERKATEER_URL:?run make sdk-lab}
      MEERKATEER_SERVICE_KEY: ${PYTHON_SERVICE_KEY:?run make sdk-lab}
      MEERKATEER_PROJECT: ${MEERKATEER_PROJECT:-sdk-lab}
      MEERKATEER_SERVICE: python-demo
      MEERKATEER_ENVIRONMENT: local
      DEMO_PORT: 19101
      DEMO_HEARTBEAT_SECONDS: ${DEMO_HEARTBEAT_SECONDS:-5}
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  node-demo:
