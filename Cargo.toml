[workspace]
members = [
  "crates/meerkateer-config",
  "crates/meerkateer-domain",
  "crates/meerkateer-identity",
  "crates/meerkateer-protocol",
  "crates/meerkateer-storage",
  "meerkateer-agent",
  "meerkateer-server",
  "meerkateer-worker",
  "sdk/rust",
]
resolver = "3"

[workspace.package]
version = "0.3.0-alpha.2"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/meerkateer/meerkateer"
authors = ["The Meerkateer Authors"]

[workspace.dependencies]
actix-web = "=4.15.0"
anyhow = "=1.0.104"
argon2 = { version = "=0.5.3", features = ["std"] }
atomic-write-file = "=0.3.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rustix = { version = "=1.1.5", features = ["fs"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
subtle = "=2.6.1"
sysinfo = { version = "=0.38.4", default-features = false, features = ["disk", "system"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
x509-parser = "=0.18.1"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
