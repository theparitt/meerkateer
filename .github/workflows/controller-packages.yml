name: Controller packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/controller-packages.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/meerkateer-protocol/**"
      - "meerkateer-agent/**"
      - "packaging/CONTROLLER-DISCLAIMER.md"
      - "packaging/debian/**"
      - "packaging/windows/**"
      - "rust-toolchain.toml"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: controller-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_VERSION: "0.2.0"

jobs:
  ubuntu-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Build controller
        run: cargo build --locked --release -p meerkateer-agent

      - name: Build Ubuntu package
        run: |
          packaging/debian/build-deb.sh \
            --binary target/release/meerkateer-agent \
            --version "$PRODUCT_VERSION" \
            --architecture amd64 \
            --output dist/meerkateer-controller_${PRODUCT_VERSION}_amd64.deb
          cd dist
          sha256sum meerkateer-controller_${PRODUCT_VERSION}_amd64.deb \
            > meerkateer-controller_${PRODUCT_VERSION}_amd64.deb.sha256
          dpkg-deb --info meerkateer-controller_${PRODUCT_VERSION}_amd64.deb
          mkdir package-check
          dpkg-deb --extract meerkateer-controller_${PRODUCT_VERSION}_amd64.deb package-check
          test -x package-check/usr/bin/meerkateer-controller
          test -x package-check/usr/lib/meerkateer/meerkateer-controller
          test -f package-check/usr/share/doc/meerkateer-controller/DISCLAIMER.md
          grep -q 'Developer Preview' package-check/usr/share/doc/meerkateer-controller/DISCLAIMER.md
          grep -Fxq 'Restart=always' package-check/lib/systemd/system/meerkateer-controller.service
          grep -Fxq 'WantedBy=multi-user.target' package-check/lib/systemd/system/meerkateer-controller.service
          grep -Fxq 'ConditionPathExists=/var/lib/meerkateer-controller/agent.json' package-check/lib/systemd/system/meerkateer-controller.service
          grep -Fq 'systemctl is-enabled --quiet "$service_name"' package-check/usr/bin/meerkateer-controller
          grep -Fq 'systemctl is-active --quiet "$service_name"' package-check/usr/bin/meerkateer-controller
          package-check/usr/lib/meerkateer/meerkateer-controller --help | grep -q '  configure  '
          package-check/usr/lib/meerkateer/meerkateer-controller --help | grep -q '  tui  '
          package-check/usr/lib/meerkateer/meerkateer-controller --help | grep -q '  test-connection  '
          rm -rf package-check

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controller-ubuntu
          path: dist/*
          if-no-files-found: error

  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Build controller
        run: cargo build --locked --release -p meerkateer-agent

      - name: Install pinned WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools wix --version 5.0.2
          ./.tools/wix.exe --version

      - name: Build portable CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist/portable | Out-Null
          Copy-Item target/release/meerkateer-agent.exe dist/portable/meerkateer-controller.exe
          Copy-Item packaging/windows/README.md dist/portable/README.md
          Copy-Item packaging/CONTROLLER-DISCLAIMER.md dist/portable/DISCLAIMER.md
          $help = & dist/portable/meerkateer-controller.exe --help
          $helpText = $help -join [Environment]::NewLine
          if ($helpText -notmatch '(?m)^  tui\s') { throw 'Portable Controller help omitted the TUI command.' }
          if ($helpText -notmatch '(?m)^  test-connection\s') { throw 'Portable Controller help omitted connection diagnostics.' }
          Compress-Archive -Path dist/portable/* `
            -DestinationPath dist/meerkateer-controller-windows-x86_64.zip

      - name: Build MSI
        shell: pwsh
        run: |
          ./packaging/windows/build-msi.ps1 `
            -ControllerExe target/release/meerkateer-agent.exe `
            -Version $env:PRODUCT_VERSION `
            -OutputPath dist/meerkateer-controller-windows-x86_64.msi `
            -WixCommand "$env:GITHUB_WORKSPACE/.tools/wix.exe"

      - name: Validate MSI
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.tools/wix.exe" msi validate `
            dist/meerkateer-controller-windows-x86_64.msi

      - name: Hash Windows packages
        shell: pwsh
        run: |
          Remove-Item -LiteralPath dist/portable -Recurse -Force
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.msi', '.zip' } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -NoNewline -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controller-windows
          path: |
            dist/*.msi
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-preview:
    needs: [ubuntu-deb, windows-msi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: controller-*
          path: dist
          merge-multiple: true

      - name: Attest Controller packages with GitHub's Sigstore-backed identity
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.deb
            dist/*.msi
            dist/*.zip

      - name: Publish rolling developer preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete controller-preview --cleanup-tag --yes || true
          gh release create controller-preview dist/* \
            --target "$GITHUB_SHA" \
            --title "Meerkateer Controller developer preview" \
            --notes "Developer-preview installers built from commit $GITHUB_SHA. The binaries are not platform code-signed yet: Windows SmartScreen may warn. Verify the adjacent SHA-256 file and GitHub build-provenance attestation before installation. Each package includes the Developer Preview notice and first enrollment requires explicit consent." \
            --prerelease
