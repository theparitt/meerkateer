name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt

      - name: Install contract validator
        run: python -m pip install --disable-pip-version-check -r tests/contracts/requirements.txt

      - name: Validate repository policy
        run: python tests/project/validate_repository.py

      - name: Validate contracts
        run: python tests/contracts/validate_contracts.py

      - name: Validate OpenAPI
        run: python tests/project/validate_openapi.py

      - name: Scan common credential shapes
        run: python tests/security/scan_secrets.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meerkateer-web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: meerkateer-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check source
        run: npm run check

      - name: Verify generated API types
        run: npm run check:api

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  sdk-node-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: Test Node.js SDK
        run: cd sdk/node && npm test

      - name: Test Go SDK
        run: cd sdk/go && go test ./...

      - name: Test PHP SDK
        run: docker run --rm -v "$PWD/sdk/php:/work" -w /work php:8.3-cli-alpine sh ./run-tests.sh

  migration-and-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
        env:
          POSTGRES_DB: meerkateer
          POSTGRES_USER: meerkateer
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meerkateer -d meerkateer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGPASSWORD: migration-test-only
      MEERKATEER_APP_PASSWORD: runtime-migration-test-only
      MEERKATEER_WORKER_PASSWORD: worker-migration-test-only
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Apply schema and development seed
        run: |
          for migration in migrations/*.sql; do
            psql -h 127.0.0.1 -U meerkateer -d meerkateer -v ON_ERROR_STOP=1 -f "$migration"
          done
          PGHOST=127.0.0.1 POSTGRES_USER=meerkateer POSTGRES_DB=meerkateer ./dev/init-runtime-role.sh
          psql -h 127.0.0.1 -U meerkateer -d meerkateer -v ON_ERROR_STOP=1 -f dev/seed.sql

      - name: Verify upgrade from migration 0007 preserves data
        run: |
          psql -h 127.0.0.1 -U meerkateer -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE meerkateer_upgrade_test'
          for migration in migrations/000[1-7]_*.sql; do
            psql -h 127.0.0.1 -U meerkateer -d meerkateer_upgrade_test -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          psql -h 127.0.0.1 -U meerkateer -d meerkateer_upgrade_test -v ON_ERROR_STOP=1 -f dev/seed.sql >/dev/null
          for migration in migrations/000[8-9]_*.sql migrations/0010_*.sql; do
            psql -h 127.0.0.1 -U meerkateer -d meerkateer_upgrade_test -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          test "$(psql -h 127.0.0.1 -U meerkateer -d meerkateer_upgrade_test -Atc "SELECT count(*) FROM services WHERE slug = 'fixture-server'")" = '1'
          test "$(psql -h 127.0.0.1 -U meerkateer -d meerkateer_upgrade_test -Atc "SELECT to_regclass('public.project_agents') IS NOT NULL")" = 't'
          test "$(psql -h 127.0.0.1 -U meerkateer -d meerkateer_upgrade_test -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'users' AND column_name = 'local_password_hash')")" = 't'
          test "$(psql -h 127.0.0.1 -U meerkateer -d meerkateer_upgrade_test -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'services' AND column_name = 'game_kind')")" = 't'

      - name: Verify tenant-scoped seed
        run: |
          visible="$(PGPASSWORD="$MEERKATEER_APP_PASSWORD" psql -h 127.0.0.1 -U meerkateer_app -d meerkateer -Atc "SET meerkateer.tenant_id = '00000000-0000-4000-8000-000000000001'; SELECT count(*) FROM services" | tail -1)"
          hidden="$(PGPASSWORD="$MEERKATEER_APP_PASSWORD" psql -h 127.0.0.1 -U meerkateer_app -d meerkateer -Atc "SET meerkateer.tenant_id = '00000000-0000-4000-8000-000000000099'; SELECT count(*) FROM services" | tail -1)"
          test "$visible" = "1"
          test "$hidden" = "0"
          reset="$(PGPASSWORD="$MEERKATEER_APP_PASSWORD" psql -h 127.0.0.1 -U meerkateer_app -d meerkateer -Atc "BEGIN; SELECT set_config('meerkateer.tenant_id', '00000000-0000-4000-8000-000000000001', true); SELECT count(*) FROM services; COMMIT; SELECT count(*) FROM services" | tail -1)"
          test "$reset" = "0"

      - name: Prove writes cannot cross tenant boundary
        run: |
          if PGPASSWORD="$MEERKATEER_APP_PASSWORD" psql -h 127.0.0.1 -U meerkateer_app -d meerkateer -v ON_ERROR_STOP=1 -c "SET meerkateer.tenant_id = '00000000-0000-4000-8000-000000000099'; INSERT INTO services (tenant_id, project_id, slug, environment) VALUES ('00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000002', 'cross-tenant', 'test')"; then
            echo "cross-tenant insert unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Prove audit events are immutable
        run: |
          PGPASSWORD="$MEERKATEER_APP_PASSWORD" psql -h 127.0.0.1 -U meerkateer_app -d meerkateer -v ON_ERROR_STOP=1 -c "SET meerkateer.tenant_id = '00000000-0000-4000-8000-000000000001'; INSERT INTO audit_events (tenant_id, actor_type, action, target_type) VALUES ('00000000-0000-4000-8000-000000000001', 'system', 'ci.test', 'tenant')"
          if PGPASSWORD="$MEERKATEER_APP_PASSWORD" psql -h 127.0.0.1 -U meerkateer_app -d meerkateer -v ON_ERROR_STOP=1 -c "SET meerkateer.tenant_id = '00000000-0000-4000-8000-000000000001'; UPDATE audit_events SET action = 'ci.changed'"; then
            echo "audit mutation unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Run identity and ingestion API regression suite
        env:
          MEERKATEER_DATABASE_URL: postgres://meerkateer_app:runtime-migration-test-only@127.0.0.1:5432/meerkateer
          MEERKATEER_BOOTSTRAP_TOKEN: ci-bootstrap-test-only
          MEERKATEER_METRICS_ENABLED: "false"
          MEERKATEER_SERVICE_ENVIRONMENT: test
          MEERKATEER_BIND_ADDR: 127.0.0.1:18080
          MEERKATEER_E2E_URL: http://127.0.0.1:18080
          RUST_LOG: warn
        run: |
          cargo build --locked -p meerkateer-agent -p meerkateer-sdk --example send_event
          export MEERKATEER_AGENT_BIN="$(pwd)/target/debug/meerkateer-agent"
          export MEERKATEER_RUST_SDK_BIN="$(pwd)/target/debug/examples/send_event"
          cargo run --locked -p meerkateer-server >/tmp/meerkateer-server.log 2>&1 &
          server_pid="$!"
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/meerkateer-server.log
            exit 1
          fi
          python3 tests/integration/api_e2e.py

      - name: Verify durable API side effects
        env:
          MEERKATEER_DATABASE_URL: postgres://meerkateer_worker:worker-migration-test-only@127.0.0.1:5432/meerkateer
          MEERKATEER_SERVICE_ENVIRONMENT: test
          RUST_LOG: warn
        run: |
          psql -h 127.0.0.1 -U meerkateer -d meerkateer -f tests/integration/prepare_outbox_worker.sql
          if PGPASSWORD="$MEERKATEER_WORKER_PASSWORD" psql -h 127.0.0.1 -U meerkateer_worker -d meerkateer -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM outbox"; then
            echo "worker login unexpectedly has direct outbox table access" >&2
            exit 1
          fi
          cargo run --locked -p meerkateer-worker -- --once
          psql -h 127.0.0.1 -U meerkateer -d meerkateer -f tests/integration/assert_e2e.sql
