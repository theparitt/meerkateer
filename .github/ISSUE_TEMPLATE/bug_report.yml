name: Bug report
description: Report a reproducible non-security defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials, player identity, or customer data. Follow SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options: [Community, Cloud, Development]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe, redacted reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
