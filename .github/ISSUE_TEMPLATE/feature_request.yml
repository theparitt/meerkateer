name: Feature request
description: Propose a scoped product or protocol improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Describe the failure, cost, or workflow rather than only a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and compatibility considerations
